query Changelog {
  changelog {
    version
    date
    notes
  }
}

mutation ReconfigureCellar($rows: Int!, $cols: Int!, $zones: Int!, $cellarId: CellarId) {
  reconfigureCellar(rows: $rows, cols: $cols, zones: $zones, cellarId: $cellarId) {
    __typename
    ... on CellarInfo {
      rows
      cols
      zones
      capacity
      placedCount
    }
    ... on CellarReconfigureBlocked {
      outOfBoundsCount
    }
  }
}

query ExportData {
  exportData
}

mutation ImportData($payload: String!) {
  importData(payload: $payload) {
    wines
    cellar
    tasting
    recommendation
    gift
    journal
  }
}

mutation DeleteAccount {
  deleteAccount
}
