query Dashboard {
  cellars {
    id
    name
  }
  dashboard {
    bottleCount
    capacity
    totalValue
    readyToDrinkCount
    favoriteCount
    readyToDrink {
      id
      name
      beverageType
      subtype
      producer
      color
      vintage
      appellation
      classification
      labelFamily
      notes
      isFavorite
      cellarId
      position
      urgent
      drinkFrom
      drinkUntil
      estimatedPrice
      stock
    }
    favorites {
      id
      name
      beverageType
      subtype
      producer
      color
      vintage
      appellation
      classification
      labelFamily
      estimatedPrice
      tastingDate
      rating
      cellarId
      position
      drinkUntil
      stock
    }
    lastBottle {
      wine {
        id
        name
        beverageType
        color
        vintage
      }
      cellarId
      position
      date
    }
    lastExit {
      type
      date
      beverageId
      beverageName
      beverageProducer
      wineBeverageType
      wineSubtype
      wineColor
      wineVintage
      wineLabelFamily
      position
      actor {
        displayName
        isMine
      }
    }
    history {
      type
      date
      beverageId
      beverageName
      beverageProducer
      wineBeverageType
      wineSubtype
      wineColor
      wineVintage
      wineLabelFamily
      position
      actor {
        displayName
        isMine
      }
    }
  }
}
