fragment CellarBottleFields on CellarBottleWithWine {
  beverageId
  cellarId
  row
  col
  rowLabel
  colLabel
  createdAt
  owner {
    displayName
    isMine
  }
  wine {
    id
    name
    beverageType
    subtype
    producer
    region
    country
    purchase {
      price
    }
    details {
      ... on WineDetails {
        color
        vintage
        appellation
        classification
        drinkWindow {
          from
          until
        }
      }
    }
  }
}

fragment CellarFields on Cellar {
  id
  name
  isPrimary
  rows
  cols
  zones
  capacity
  placedCount
}

query Cellars {
  cellars {
    ...CellarFields
  }
}

fragment JournalEventFields on JournalEvent {
  type
  date
  beverageId
  beverageName
  wineBeverageType
  wineColor
  position
  actor {
    displayName
    isMine
  }
}

# The cellar screen as it opens: the household's cellars, the first page of one
# cellar's bottles and of the journal, in one round trip.
query CellarOverview($limit: Int, $cellarId: CellarId) {
  cellars {
    ...CellarFields
  }
  cellarBottles(limit: $limit, cellarId: $cellarId) {
    items {
      ...CellarBottleFields
    }
    hasMore
  }
  journalEvents(limit: $limit) {
    items {
      ...JournalEventFields
    }
    hasMore
    endCursor
  }
}

query CellarBottles($limit: Int, $after: BeverageId, $cellarId: CellarId) {
  cellarBottles(limit: $limit, after: $after, cellarId: $cellarId) {
    items {
      ...CellarBottleFields
    }
    hasMore
  }
}

query CellarHistory($limit: Int, $after: JournalEntryId) {
  journalEvents(limit: $limit, after: $after) {
    items {
      ...JournalEventFields
    }
    hasMore
    endCursor
  }
}

# The whole grid of one cellar, to place or move a bottle: every bottle, the grid
# size, the household's cellars to switch between and, when placing, the
# suggested free slot — one round trip. A cellar is bounded by its physical
# capacity, so one large page covers it all.
query CellarGrid($withSuggestion: Boolean!, $cellarId: CellarId) {
  cellars {
    ...CellarFields
  }
  cellarBottles(limit: 1000, cellarId: $cellarId) {
    items {
      ...CellarBottleFields
    }
  }
  cellarInfo(cellarId: $cellarId) {
    rows
    cols
  }
  suggestCellarPosition(cellarId: $cellarId) @include(if: $withSuggestion) {
    rowLabel
    colLabel
  }
}
