mutation PlaceBottle($beverageId: BeverageId!, $row: Int!, $col: Int!, $cellarId: CellarId) {
  placeBottle(beverageId: $beverageId, row: $row, col: $col, cellarId: $cellarId) {
    beverageId
    row
    col
    rowLabel
    colLabel
  }
}

mutation MoveBottle($beverageId: BeverageId!, $row: Int!, $col: Int!, $cellarId: CellarId) {
  moveBottle(beverageId: $beverageId, row: $row, col: $col, cellarId: $cellarId) {
    beverageId
    row
    col
    rowLabel
    colLabel
  }
}

mutation ConsumeBottle($beverageId: BeverageId!, $input: ConsumptionInput!) {
  consumeBottle(beverageId: $beverageId, input: $input)
}

mutation GiftBottle($beverageId: BeverageId!, $input: GiftInput!) {
  giftBottle(beverageId: $beverageId, input: $input)
}

mutation RemoveBottle($beverageId: BeverageId!) {
  removeBottle(beverageId: $beverageId)
}

mutation CreateCellar($name: CellarName!, $rows: Int!, $cols: Int!, $zones: Int) {
  createCellar(name: $name, rows: $rows, cols: $cols, zones: $zones) {
    ...CellarFields
  }
}

mutation RenameCellar($id: CellarId!, $name: CellarName!) {
  renameCellar(id: $id, name: $name) {
    ...CellarFields
  }
}

mutation DeleteCellar($id: CellarId!) {
  deleteCellar(id: $id)
}
