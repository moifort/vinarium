fragment EntitlementFields on Entitlement {
  plan
  appAccountToken
  productId
  expiresOn
}

fragment QuotaFields on Quota {
  plan
  used
  limit
  remaining
  welcomeRemaining
  totalRemaining
  renewsOn
}

# The plan and the allowance, read together.
query SubscriptionState {
  entitlement {
    ...EntitlementFields
  }
  quota {
    ...QuotaFields
  }
}

query Quota {
  quota {
    ...QuotaFields
  }
}

mutation SyncEntitlement($signedTransaction: String!) {
  syncEntitlement(signedTransaction: $signedTransaction) {
    ...EntitlementFields
  }
}
