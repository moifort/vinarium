fragment MeFields on Me {
  firstName
  onboardingCompleted
  onboardingCompletedAt
  isAdmin
}

query Me {
  me {
    ...MeFields
  }
}

# The opening of the app: who the user is, what their plan allows and how much
# of it is left — everything the launch needs, in one round trip.
query Launch {
  me {
    ...MeFields
  }
  entitlement {
    ...EntitlementFields
  }
  quota {
    ...QuotaFields
  }
}

mutation CompleteOnboarding($input: CompleteOnboardingInput!) {
  completeOnboarding(input: $input) {
    firstName
    onboardingCompleted
    onboardingCompletedAt
  }
}
