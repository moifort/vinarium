query AdminMetrics {
  adminMetrics {
    costs {
      geminiEur
      infraEur
      totalEur
      projectedEur
      previousMonthEur
      changeVsPreviousMonth
      billedThrough
      days {
        day
        geminiEur
        infraEur
      }
    }
    sessions {
      day
      sessions
    }
    totalUsers
    newUsers
    premiumTotal
    newPremium
    revenueProceedsEur
    revenueGrossEur
    scans
    cacheHits
    vision {
      ...AiTokenUsageFields
    }
    enrichment {
      ...AiTokenUsageFields
    }
    refreshedAt
  }
}

fragment AiTokenUsageFields on AiTokenUsage {
  promptTokens
  outputTokens
  thinkingTokens
}
