name: Build

# Runs at release only: the iOS release workflow calls it before anything is
# archived, and a failure there stops the release (no upload, no submission). A push
# to main builds no app, so the backend ships without waiting on a macOS runner. A
# manual run checks the app at any time.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Whether the app still compiles, with the Apollo code regenerated from the
  # committed schema: a backend change the iOS operations no longer match fails here,
  # before the archive. Builds the same way as the release, minus signing and
  # uploading. macos-26 is a standard runner, free on a public repository.
  ios:
    name: 📱 iOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select the latest final Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Materialize gitignored build files
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}" \
            | openssl base64 -d -A > ios/Vinarium/GoogleService-Info.plist
          cp ios/Vinarium/Shared/Secrets.swift.example ios/Vinarium/Shared/Secrets.swift

      - name: Generate Apollo GraphQL code (gitignored, regenerated per build)
        run: |
          set -euo pipefail
          # Resolve SPM so the apollo-ios checkout (and its bundled CLI) exists.
          xcodebuild -resolvePackageDependencies \
            -project ios/Vinarium.xcodeproj -scheme Vinarium
          # Apollo 2.x ships the CLI as a tarball inside the checkout — extract it.
          CLI_DIR=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d \
            -path "*/SourcePackages/checkouts/apollo-ios/CLI" | head -1)
          tar -xzf "$CLI_DIR/apollo-ios-cli.tar.gz" -C "$CLI_DIR"
          chmod +x "$CLI_DIR/apollo-ios-cli"
          (cd ios && "$CLI_DIR/apollo-ios-cli" generate)

      - name: Build the app
        run: |
          set -euo pipefail
          # A generic simulator destination: the check is that the app compiles, so it
          # needs no booted device and no signing identity (the release job owns those).
          xcodebuild -project ios/Vinarium.xcodeproj -scheme Vinarium \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
