name: App Store screenshots

# Uploads the marketing panels of screenshots/appstore/<lang>/ to App Store Connect.
# Called by release-ios.yml on every tag, and runnable on its own when the panels
# change outside a release (or when a release shipped without them).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to open if the store has no editable one, e.g. 1.7 (leave empty otherwise)'
        required: false
        default: ''
  workflow_call:

permissions:
  contents: read

concurrency:
  group: appstore-screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    name: 🖼️ App Store screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install the App Store Connect API key
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Upload the panels
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        # The version has to be editable: a version already in review refuses new
        # screenshots, so this runs before the submission, not after it. On a release
        # tag the version does not exist yet — the submission used to create it — so
        # the script is told which one to open. A manual run can name it too.
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            ios-v*) export APP_VERSION="${RELEASE_TAG#ios-v}" ;;
          esac
          bun run scripts/upload-appstore-panels.ts
